# Exactly one executor is assembled after the startup shell choice is available.
# Retain the official rows' configs; Native Passthrough reads them unchanged.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: true
- insert:
    - id: dsh-shell
      name: dsh-shell
      config:
        shell: auto
    - id: selected-shell
      name: dsh-shell/assembly
      config:
        timeoutMs: 60000

# Preserve authored presets (including user modifications). The selection plugin
# adapts only these official carriers' runtime copies in Auto/Manual; Default
# keeps their complete native compositions and original plugin registrations.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  inject: ['shellSelection']
- id: preset-ptc
  name: '@deepseek-ai/dsh-agent-preset'
  inject: ['shellSelection']
- id: preset-cordis
  name: '@deepseek-ai/dsh-agent-preset'
  inject: ['shellSelection']
- id: preset-minimal
  name: '@deepseek-ai/dsh-agent-preset'
  inject: ['shellSelection']
