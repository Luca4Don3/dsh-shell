# Replace DSH's platform-specific one-shot executor with the selected shell.
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- insert:
    - id: dsh-shell
      name: dsh-shell
      config:
        shell: auto
    - id: selected-shell
      name: dsh-shell/shell
      config:
        timeoutMs: 60000

# DSH replaces a row's entire config, so this restates the shipped minimal preset.
- id: preset-minimal
  config:
    id: minimal
    order: 3
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a helpful software engineer assistant.
          complete: true
          includeRuntimeContext: false
      - id: persistent-shell
        name: cordis:group
        group: true
        isolate:
          terminals: true
        config:
          - id: pty
            name: '@deepseek-ai/dsh-terminal'
          - id: terminal-selected-shell
            name: dsh-shell/terminal
            config:
              timeoutMs: 300000
          - id: persistent-selected-shell
            name: dsh-shell/persistent
            config:
              timeoutMs: 300000
